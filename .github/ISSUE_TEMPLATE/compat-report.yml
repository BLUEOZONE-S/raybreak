name: Compatibility report
description: Share what works on your Rayjet (or similar Trotec/Speedy2 machine)
labels: ["compatibility"]
body:
  - type: input
    id: model
    attributes: {label: "Machine model and year", placeholder: "Rayjet 50, about 2014"}
    validations: {required: true}
  - type: input
    id: handshake
    attributes: {label: "Handshake reply to TS;", placeholder: "04.02-21.00-06.62"}
  - type: textarea
    id: axes
    attributes: {label: "Which axes move from the scripts? (left-right, front-back, Z)", description: "Say exactly what you ran and what you saw."}
    validations: {required: true}
  - type: textarea
    id: report
    attributes: {label: "Output of tools/rayjet_report.py", description: "Paste it. Check it contains no serial number or licence data first.", render: markdown}
  - type: textarea
    id: extra
    attributes: {label: "Anything else", description: "LED behaviour, photos, Windows version, USB adapter."}
